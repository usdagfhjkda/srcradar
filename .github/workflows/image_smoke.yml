name: image_smoke

# Build the image and run the smoke matrix against it.
#
# The build compiles the whole toolchain (Go, C++, the vendored mirrors),
# so it is expensive: it runs on demand, not on every push. The release
# tarballs come out of this workflow as artifacts.
#
# What it does:
#   1. builds the variant(s) the run asks for
#   2. runs tests/verify_image.sh against each image: the component set,
#      the language, the resolver set, the extra binaries and their paths
#   3. runs tests/run_smoke_in_image.sh: the 11-port x 3-round matrix of
#      tests/run_smoke.sh INSIDE the container, plus the liveness checks
#      (boot, the services, the watchdog, a restart, a soak)
#   4. saves the tarball of each variant as an artifact
#
# The matrix needs the internet (www.localtest.me resolves to 127.0.0.1
# through a public DNS record), so a failure of the matrix is reported as a
# warning: the network is not a property of the image. The liveness checks
# and the contract checks must pass.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "the variant to build and test"
        type: choice
        options:
          - en
          - zh
          - both
        default: both
      soak_seconds:
        description: "how long the container is watched while it idles"
        type: string
        default: "90"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SRCRADAR_VERSION: 1.0.0

jobs:
  image:
    name: image (${{ inputs.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant:
          - ${{ inputs.variant == 'both' && 'en' || inputs.variant }}
          - ${{ inputs.variant == 'both' && 'zh' || inputs.variant }}
    steps:
      - uses: actions/checkout@v4

      - name: the variant axes
        run: |
          case "${{ matrix.variant }}" in
            en)
              echo "LANG=en"        >> "$GITHUB_ENV"
              echo "RESOLVER=global" >> "$GITHUB_ENV"
              echo "WITH_DBALIGN=0"  >> "$GITHUB_ENV"
              echo "WITH_YMICP=0"    >> "$GITHUB_ENV"
              ;;
            zh)
              echo "LANG=zh"        >> "$GITHUB_ENV"
              echo "RESOLVER=cn"    >> "$GITHUB_ENV"
              echo "WITH_DBALIGN=1"  >> "$GITHUB_ENV"
              echo "WITH_YMICP=1"    >> "$GITHUB_ENV"
              ;;
            *) echo "unknown variant"; exit 1 ;;
          esac
          echo "TAG=srcradar:${SRCRADAR_VERSION}_${LANG}"
          echo "TAG=srcradar:${SRCRADAR_VERSION}_${LANG}" >> "$GITHUB_ENV"

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.TAG }}
          build-args: |
            SRCRADAR_VERSION=${{ env.SRCRADAR_VERSION }}
            SRCDAR_LANG=${{ env.LANG }}
            SRCDAR_RESOLVER=${{ env.RESOLVER }}
            SRCDAR_WITH_DBALIGN=${{ env.WITH_DBALIGN }}
            SRCDAR_WITH_YMICP=${{ env.WITH_YMICP }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: the image contract
        run: bash tests/verify_image.sh "${{ env.TAG }}" "${{ env.LANG }}" "${{ env.RESOLVER }}"

      - name: the smoke matrix and the liveness checks
        env:
          SOAK_SECONDS: ${{ inputs.soak_seconds }}
        run: bash tests/run_smoke_in_image.sh "${{ env.TAG }}" "${{ env.LANG }}" "${{ env.RESOLVER }}"

      - name: the tarball
        run: |
          docker save "${{ env.TAG }}" -o "srcradar-${SRCRADAR_VERSION}_${LANG}.tar"
          sha256sum "srcradar-${SRCRADAR_VERSION}_${LANG}.tar" \
            > "srcradar-${SRCRADAR_VERSION}_${LANG}.tar.sha256"
          cat "srcradar-${SRCRADAR_VERSION}_${LANG}.tar.sha256"
          ls -lh "srcradar-${SRCRADAR_VERSION}_${LANG}.tar"

      - name: upload the tarball
        uses: actions/upload-artifact@v4
        with:
          name: srcradar-${{ env.SRCRADAR_VERSION }}_${{ env.LANG }}
          path: |
            srcradar-${{ env.SRCRADAR_VERSION }}_${{ env.LANG }}.tar
            srcradar-${{ env.SRCRADAR_VERSION }}_${{ env.LANG }}.tar.sha256
          retention-days: 30
