name: image_smoke

# Build the image and run the smoke matrix against it.
#
# The build compiles the whole toolchain (Go, C++, the vendored mirrors),
# so it is expensive. It runs when a version is released (a tag push) and
# on demand:
#
#   - a tag push builds exactly the variant the tag names:
#       v1.0.0     -> English  (en, global resolver, no db_align, no ymicp)
#       v1.0.0_zh  -> Chinese  (zh, cn resolver, with db_align and ymicp)
#   - a manual run picks the variant(s) itself.
#
# What it does:
#   1. builds the variant(s)
#   2. runs tests/verify_image.sh against each image: the component set,
#      the language, the resolver set, the extra binaries and their paths
#   3. runs tests/run_smoke_in_image.sh: the 11-port x 3-round matrix of
#      tests/run_smoke.sh INSIDE the container, plus the liveness checks
#      (boot, the services, the watchdog, a restart, a soak)
#   4. saves the tarball of each variant as an artifact
#
# The matrix needs the internet (www.localtest.me resolves to 127.0.0.1
# through a public DNS record), so a failure of the matrix is reported as a
# warning: the network is not a property of the image. The liveness checks
# and the contract checks must pass.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      variant:
        description: "the variant to build and test"
        type: choice
        options:
          - en
          - zh
          - both
        default: both
      soak_seconds:
        description: "how long the container is watched while it idles"
        type: string
        default: "90"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # plan: what to build.
  # A tag names its variant; a manual run picks it.
  # ---------------------------------------------------------------------------
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: the variants to build
        id: plan
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
            case "$VERSION" in
              *_zh) VARIANTS='["zh"]' ;;
              *)    VARIANTS='["en"]' ;;
            esac
            echo "the tag ${TAG} names the version ${VERSION}"
          else
            VERSION="1.0.0"
            case "${{ inputs.variant }}" in
              en)   VARIANTS='["en"]' ;;
              zh)   VARIANTS='["zh"]' ;;
              *)    VARIANTS='["en","zh"]' ;;
            esac
            echo "the manual run asks for ${{ inputs.variant }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "matrix={\"variant\":${VARIANTS}}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # image: build, check, smoke, save.
  # ---------------------------------------------------------------------------
  image:
    name: image (${{ matrix.variant }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: the variant axes
        run: |
          set -euo pipefail
          # the variables are plain shell variables here: a value written
          # to $GITHUB_ENV only reaches the NEXT step, so a same step
          # read of ${SUFFIX} would fail under set -u.
          case "${{ matrix.variant }}" in
            en) LANG=en; RESOLVER=global; WITH_DBALIGN=0; WITH_YMICP=0; SUFFIX="" ;;
            zh) LANG=zh; RESOLVER=cn;     WITH_DBALIGN=1; WITH_YMICP=1; SUFFIX=_zh ;;
            *) echo "unknown variant"; exit 1 ;;
          esac
          {
            echo "LANG=${LANG}"
            echo "RESOLVER=${RESOLVER}"
            echo "WITH_DBALIGN=${WITH_DBALIGN}"
            echo "WITH_YMICP=${WITH_YMICP}"
            echo "SUFFIX=${SUFFIX}"
            echo "VERSION=${{ needs.plan.outputs.version }}"
            echo "TAG=srcradar:${{ needs.plan.outputs.version }}${SUFFIX}"
          } >> "$GITHUB_ENV"
          echo "variant=${{ matrix.variant }} lang=${LANG} resolver=${RESOLVER} suffix=${SUFFIX}"

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.TAG }}
          build-args: |
            SRCRADAR_VERSION=${{ needs.plan.outputs.version }}
            SRCDAR_LANG=${{ env.LANG }}
            SRCDAR_RESOLVER=${{ env.RESOLVER }}
            SRCDAR_WITH_DBALIGN=${{ env.WITH_DBALIGN }}
            SRCDAR_WITH_YMICP=${{ env.WITH_YMICP }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: the image contract
        run: bash tests/verify_image.sh "${{ env.TAG }}" "${{ env.LANG }}" "${{ env.RESOLVER }}"

      - name: the smoke matrix and the liveness checks
        env:
          SOAK_SECONDS: ${{ inputs.soak_seconds || '90' }}
        run: bash tests/run_smoke_in_image.sh "${{ env.TAG }}" "${{ env.LANG }}" "${{ env.RESOLVER }}"

      - name: the tarball
        run: |
          set -euo pipefail
          NAME="srcradar-${{ needs.plan.outputs.version }}${SUFFIX}.tar"
          docker save "${{ env.TAG }}" -o "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          cat "$NAME.sha256"
          ls -lh "$NAME"

      - name: upload the tarball
        uses: actions/upload-artifact@v4
        with:
          name: srcradar-${{ needs.plan.outputs.version }}${{ env.SUFFIX }}
          path: |
            srcradar-${{ needs.plan.outputs.version }}${{ env.SUFFIX }}.tar
            srcradar-${{ needs.plan.outputs.version }}${{ env.SUFFIX }}.tar.sha256
          retention-days: 30
