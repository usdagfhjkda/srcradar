# ============================================================================
# docker-compose.yml — srcradar single-host deployment
#
# Usage:
#   docker compose up -d                    # background
#   docker compose logs -f                  # follow logs
#   docker compose exec srcradar bash       # interactive shell
#   docker compose exec srcradar srcradar pdtm scan -b ExampleCo
#   docker compose exec srcradar srcradar daily daily_monitor
#   docker compose down                     # stop (data volume preserved)
#
# The image is published as a tarball:
#   docker load -i srcradar-1.0.0_zh.tar
#   docker compose up -d
#
# Persistence:
#   - srcradar-data: /data (the legacy DB + the user data)
#   - srcradar-config: /opt/srcradar/config (the user configs)
#
# Network:
#   The dashboard and the MCP daemon bind 0.0.0.0 inside the container (the
#   docker proxy forwards to the container address). The host side of both
#   mappings is 127.0.0.1, so only the host itself can reach them.
#   The service sits on its own bridge network, so the other containers of
#   the host cannot reach it either.
#
# The ymicp server:
#   The ymicp module ships the client only. Its server is the third party
#   image yiminger/ymicp, which carries no open source license, so it is not
#   redistributed in the srcradar image. Deploy it on your own:
#
#     docker compose -f modules/public/ymicp/docker-compose.yml up -d
#
#   Then point the client at it. If the server runs in the srcradar-net
#   network, use its service name; if it runs on the host, use
#   host.docker.internal (Linux needs the extra_hosts entry below).
#
#     YMICP_BASE: http://ymicp:16181
#
# ============================================================================

services:
  srcradar:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SRCRADAR_VERSION: 1.0.0
        PDTM_VERSION: v0.1.5       # pdtm 包管理器版本(锁);pdtm 拉的 PD 工具 = build 时 latest,被 image 冻结
    image: srcradar:1.0.0_zh
    container_name: srcradar
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # The language of every user-visible output (the CLI, the dashboard,
      # the daily report and the notification email).
      SRCDAR_LANG: zh
      # The dashboard and the MCP daemon; 0.0.0.0 inside the container, the
      # host side of the mapping is 127.0.0.1 (see the ports section).
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: "8765"
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8764"
      # Where the operator deployed the ymicp server (the third party image
      # yiminger/ymicp is not redistributed in this image). The default of
      # the client is http://127.0.0.1:16181, which is the container itself.
      YMICP_BASE: "http://ymicp:16181"
    volumes:
      - srcradar-data:/data
      - srcradar-config:/opt/srcradar/config
      # Optional: ENScan cookie (db_align is excluded from this image, so
      # the ENScan stages are not available here).
      # Optional: host naabu SYN mode requires NET_RAW; or use CONNECT mode
      #   cap_add:
      #     - NET_RAW                  # uncomment if you want naabu SYN mode
    # cap_add:
    #   - NET_RAW                  # uncomment if you want naabu SYN mode
    ports:
      # Dashboard: bind to localhost only; expose via SSH tunnel if remote
      - "127.0.0.1:8765:8765"
      # MCP daemon: bind to localhost only (the daemon trusts the loopback)
      - "127.0.0.1:8764:8764"
    networks:
      - srcradar-net
    # lets the container reach a ymicp server that runs on the host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Default command prints help; override per-run:
    #   docker compose exec srcradar srcradar pdtm scan -b ExampleCo
    command: ["srcradar", "--list"]

networks:
  srcradar-net:
    name: srcradar-net
    driver: bridge

volumes:
  srcradar-data:
    name: srcradar-data
  srcradar-config:
    name: srcradar-config
